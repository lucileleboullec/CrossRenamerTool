name: Linter

on:
  workflow_call:

permissions:
      contents: write

jobs:
  build:
    name: Ruff linter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff format
        run: ruff format .

      - name: Auto Commit Messages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "♻️ reformatting by ruff"

      - name: Ruff Check
        run: ruff check --fix --output-format=github