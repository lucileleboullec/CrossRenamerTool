[project]
name = "crossrenamertool"
version = "1.0.0"
description = "This tool is a production-ready renaming utility for Autodesk Maya and Blender."
readme = "README.md"
requires-python = ">=3.11"

authors = [{name = "Lucile Le Boullec", email="l.le-boullec@lahorde.school"}]

dependencies = [
    "PySide6>=6.5.3",
]

[project.optional-dependencies]
# pip install crossrenamertool[dev]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
# pip install crossrenamertool[docs]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]>=2.0.8",
    "mkdocs-mermaid2-plugin",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    ".github",
    "tests",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (imports inutilisés, variables non définies...)
    "I",      # isort (ordre des imports)
    "W",      # pycodestyle warnings
    "B",      # bugbear (patterns dangereux)
    "BLE",    # blind exception (BLE001 que tu vois en CI)
    "PIE",    # miscellaneous (PIE790 pass inutile)
    "RUF",    # ruff-specific (RUF012 mutable default)
    "UP",     # pyupgrade (syntaxe moderne Python)
]
ignore = [
    "E501",   # line too long
    "RUF012",  # mutable class attribute
]

[tool.ruff.lint.isort]
known-first-party = ["crossrenamertool"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"