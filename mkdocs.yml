site_name: Cross Renamer Tool
use_directory_urls: false
site_url: https://lucileleboullec.github.io/CrossRenamerTool/

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - search
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.instant
    - navigation.hidden
    - navigation.tabs
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share

  font:
    text: Roboto
    code: Roboto Mono
  

  palette:
    # Palette toggle for light mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

    # Palette toggle for dark mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

plugins:
  - search
  - mermaid2
  - mkdocstrings:
     default_handler: python
     handlers:
       python:
         paths: [src]
         options:
           docstring_style: google
           heading_level: 3
           show_source: true
           group_by_category: true
           show_category_heading: true
           show_root_toc_entry: false
           merge_init_into_class: true
markdown_extensions:
  # Python Markdown
  - toc:
      permalink: true
  - attr_list: {}
  # Python Markdown Extensions
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
        custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home : index.md
  - Installation: installation.md
  - User Manual:
    - Overview: user_manual/index.md